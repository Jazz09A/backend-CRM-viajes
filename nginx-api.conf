# /etc/nginx/sites-available/api.escapatetour.app
# Enlace en /etc/nginx/sites-enabled/api.escapatetour.app

server {
    server_name api.escapatetour.app;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Certificados (certbot los pondrá aquí)
    # ssl_certificate /etc/letsencrypt/live/api.escapatetour.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.escapatetour.app/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection 1; mode=block always;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy al backend (puerto 8100)
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Seguridad adicional
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Aumentar el tamaño máximo de cuerpo para uploads
        client_max_body_size 100M;
    }

    # Health check endpoint (opcional)
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}