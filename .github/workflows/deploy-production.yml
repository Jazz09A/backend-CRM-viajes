name: Deploy producción

# Fase 5 — CD: al mergear a main se buildea la imagen Docker, se push-ea a
# GHCR y el server hace pull + docker compose up (api.escapatetour.app).
# Requiere el secret DEPLOY_SSH_KEY (clave privada de alvaro@62.171.175.92).
# El server necesita Docker + /opt/escapatetour/backend/{docker-compose.yml,.env}
# (Fase 4) y alvaro en el grupo docker.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Imagen + deploy al server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige nombres en minúsculas (el repo es Jazz09A/...).
      - name: Nombre de imagen normalizado
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clave SSH del deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 62.171.175.92 >> ~/.ssh/known_hosts

      - name: Pull + reinicio en el server
        run: >-
          ssh -p 2222 -i ~/.ssh/deploy_key alvaro@62.171.175.92
          "docker compose -f /opt/escapatetour/backend/docker-compose.yml pull
          && docker compose -f /opt/escapatetour/backend/docker-compose.yml up -d"

      - name: Healthcheck /api/v1/ready
        run: |
          for i in $(seq 1 36); do
            if curl -sf https://api.escapatetour.app/api/v1/ready > /dev/null; then
              echo "✅ API lista"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Healthcheck falló — logs del contenedor:"
          ssh -p 2222 -i ~/.ssh/deploy_key alvaro@62.171.175.92 \
            "docker compose -f /opt/escapatetour/backend/docker-compose.yml logs --tail 60" || true
          exit 1
